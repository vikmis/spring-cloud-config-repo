spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

product:
  service:
    url: http://localhost:9090
